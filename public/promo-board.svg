<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="100%" height="100%">
  <defs>
    <!-- Background Stars -->
    <pattern id="stars" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="40" r="1.5" fill="#ffffff" opacity="0.15" />
      <circle cx="150" cy="10" r="1" fill="#ffffff" opacity="0.3" />
      <circle cx="80" cy="120" r="2" fill="#ffffff" opacity="0.1" />
      <circle cx="180" cy="170" r="1.5" fill="#ffffff" opacity="0.2" />
      <circle cx="40" cy="180" r="1" fill="#ffffff" opacity="0.25" />
      <circle cx="110" cy="70" r="1.5" fill="#ffffff" opacity="0.1" />
    </pattern>

    <!-- Black Hole Gradients -->
    <radialGradient id="bh-horizon" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#9d4edd" stop-opacity="0" />
      <stop offset="90%" stop-color="#9d4edd" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bh-accretion" cx="50%" cy="50%" r="50%">
      <stop offset="30%" stop-color="#030508" stop-opacity="1" />
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0" />
    </radialGradient>

    <!-- Player Glow Gradients -->
    <radialGradient id="glow-p1" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#00f0ff" stop-opacity="0.7"/><stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-p2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ff007f" stop-opacity="0.7"/><stop offset="100%" stop-color="#ff007f" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-p3" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f59e0b" stop-opacity="0.7"/><stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-p4" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#9d4edd" stop-opacity="0.7"/><stop offset="100%" stop-color="#9d4edd" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-p5" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#00ff66" stop-opacity="0.7"/><stop offset="100%" stop-color="#00ff66" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-p6" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ef4444" stop-opacity="0.7"/><stop offset="100%" stop-color="#ef4444" stop-opacity="0"/></radialGradient>

    <!-- Asteroid Gradient -->
    <radialGradient id="asteroid-grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    
    <!-- Outer Glow Filter for Text -->
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="bh-text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Background -->
  <rect width="1200" height="1200" fill="#030508" />
  
  <!-- Starfield -->
  <rect width="1200" height="1200" fill="url(#stars)" />

  <!-- The Grid (12x12, 100px cells) -->
  <g stroke="rgba(0, 240, 255, 0.15)" stroke-width="1.5">
    <path d="M100 0 V1200 M200 0 V1200 M300 0 V1200 M400 0 V1200 M500 0 V1200 M600 0 V1200 M700 0 V1200 M800 0 V1200 M900 0 V1200 M1000 0 V1200 M1100 0 V1200" />
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200 M0 600 H1200 M0 700 H1200 M0 800 H1200 M0 900 H1200 M0 1000 H1200 M0 1100 H1200" />
  </g>

  <!-- Center Crosshairs -->
  <path d="M0 600 H1200 M600 0 V1200" stroke="rgba(0, 240, 255, 0.4)" stroke-width="2" />

  <!-- THE BLACK HOLE -->
  <g transform="translate(600, 600)">
    <!-- Event Horizon Ring -->
    <circle r="300" fill="url(#bh-horizon)" />
    <circle r="290" fill="none" stroke="#9d4edd" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Accretion Disk -->
    <circle r="200" fill="url(#bh-accretion)" />
    
    <!-- Core -->
    <circle r="65" fill="#030508" />
    
    <!-- Label -->
    <text x="0" y="-5" fill="#f59e0b" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle" filter="url(#bh-text-glow)" letter-spacing="1">BLACK</text>
    <text x="0" y="15" fill="#f59e0b" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle" filter="url(#bh-text-glow)" letter-spacing="1">HOLE</text>
  </g>

  <!-- ASTEROIDS -->
  <g>
    <!-- Col 2, Row 4 -->
    <circle cx="250" cy="450" r="28" fill="url(#asteroid-grad)" stroke="#334155" stroke-width="2" />
    <path d="M240 440 A 5 5 0 1 1 245 445" stroke="#1e293b" stroke-width="2" fill="none" />
    <path d="M260 460 A 8 8 0 1 1 268 465" stroke="#1e293b" stroke-width="3" fill="none" />
    
    <!-- Col 1, Row 7 -->
    <circle cx="150" cy="750" r="28" fill="url(#asteroid-grad)" stroke="#334155" stroke-width="2" />
    <path d="M140 740 A 6 6 0 1 1 148 748" stroke="#1e293b" stroke-width="2.5" fill="none" />
    
    <!-- Col 11, Row 4 -->
    <circle cx="1150" cy="450" r="28" fill="url(#asteroid-grad)" stroke="#334155" stroke-width="2" />
    <path d="M1145 445 A 5 5 0 1 1 1152 450" stroke="#1e293b" stroke-width="2" fill="none" />

    <!-- Col 9, Row 6 -->
    <circle cx="950" cy="650" r="28" fill="url(#asteroid-grad)" stroke="#334155" stroke-width="2" />
    
    <!-- Col 10, Row 7 -->
    <circle cx="1050" cy="750" r="28" fill="url(#asteroid-grad)" stroke="#334155" stroke-width="2" />
    
    <!-- Col 10, Row 8 -->
    <circle cx="1050" cy="850" r="28" fill="url(#asteroid-grad)" stroke="#334155" stroke-width="2" />
  </g>

  <!-- ENERGY FIELDS -->
  <g stroke="#00ff66" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#text-glow)">
    <!-- Left of P2 (Col 7, Row 4) -->
    <g transform="translate(750, 450) rotate(-90)">
      <path d="M -10 16 Q -5 10 0 14 T 10 12" />
      <path d="M -14 6 Q -8 -2 0 4 T 14 2" />
      <path d="M -18 -4 Q -10 -14 0 -6 T 18 -8" />
    </g>
    <!-- Right of P2 (Col 9, Row 4) -->
    <g transform="translate(950, 450) rotate(90)">
      <path d="M -10 16 Q -5 10 0 14 T 10 12" />
      <path d="M -14 6 Q -8 -2 0 4 T 14 2" />
      <path d="M -18 -4 Q -10 -14 0 -6 T 18 -8" />
    </g>
  </g>

  <!-- PLAYERS -->
  <g>
    <!-- P1 (Cyan) Col 3, Row 6 -->
    <g transform="translate(350, 650)">
      <circle r="140" fill="url(#glow-p1)" />
      <circle r="30" fill="none" stroke="#00f0ff" stroke-width="8" opacity="0.8" />
      <circle r="18" fill="#ffffff" filter="url(#text-glow)" />
      <text x="-16" y="-45" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="20" filter="url(#text-glow)">P1</text>
    </g>

    <!-- P2 (Pink) Col 8, Row 4 -->
    <g transform="translate(850, 450)">
      <circle r="140" fill="url(#glow-p2)" />
      <circle r="30" fill="none" stroke="#ff007f" stroke-width="8" opacity="0.8" />
      <circle r="18" fill="#ffffff" filter="url(#text-glow)" />
      <text x="-16" y="-45" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="20" filter="url(#text-glow)">P2</text>
    </g>

    <!-- P3 (Orange) Col 7, Row 2 -->
    <g transform="translate(750, 250)">
      <circle r="140" fill="url(#glow-p3)" />
      <circle r="30" fill="none" stroke="#f59e0b" stroke-width="8" opacity="0.8" />
      <circle r="18" fill="#ffffff" filter="url(#text-glow)" />
      <text x="-16" y="-45" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="20" filter="url(#text-glow)">P3</text>
    </g>

    <!-- P4 (Purple) Col 8, Row 7 -->
    <g transform="translate(850, 750)">
      <circle r="140" fill="url(#glow-p4)" />
      <circle r="30" fill="none" stroke="#9d4edd" stroke-width="8" opacity="0.8" />
      <circle r="18" fill="#ffffff" filter="url(#text-glow)" />
      <text x="-16" y="-45" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="20" filter="url(#text-glow)">P4</text>
    </g>

    <!-- P5 (Green) Col 6, Row 1 -->
    <g transform="translate(650, 150)">
      <circle r="140" fill="url(#glow-p5)" />
      <circle r="30" fill="none" stroke="#00ff66" stroke-width="8" opacity="0.8" />
      <circle r="18" fill="#ffffff" filter="url(#text-glow)" />
      <text x="-16" y="-45" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="20" filter="url(#text-glow)">P5</text>
    </g>

    <!-- P6 (Red) Col 5, Row 10 -->
    <g transform="translate(550, 1050)">
      <circle r="140" fill="url(#glow-p6)" />
      <circle r="30" fill="none" stroke="#ef4444" stroke-width="8" opacity="0.8" />
      <circle r="18" fill="#ffffff" filter="url(#text-glow)" />
      <text x="-16" y="-45" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="20" filter="url(#text-glow)">P6</text>
    </g>
  </g>
</svg>
