<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Gravity Pulse 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function() {
        const gameId = 'gravitypulse';
        const today = new Date().toISOString().split('T')[0];
        const lastVisit = localStorage.getItem('bg_last_visit_' + gameId);
        if (lastVisit !== today) {
          fetch('https://www.blanchettegames.com/api/track-play?game=' + gameId, { method: 'POST' })
            .then(res => { if (res.ok) localStorage.setItem('bg_last_visit_' + gameId, today); })
            .catch(() => {});
        }
      })();
    </script>
  </body>
</html>
